# Render Blueprint: deploys the backend and the AI service from this repo.
# Render dashboard -> New -> Blueprint -> pick this repo.
# Values marked "sync: false" are asked for in the dashboard (never commit secrets).
# The frontend is deployed separately on Vercel (see frontend/vercel.json).

services:
  # Express API + Socket.IO (live calls and chat)
  - type: web
    name: smartlurn-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ORIGINS # your Vercel URL, e.g. https://smartlurn.vercel.app
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Cloudflare Realtime TURN for video calls (dashboard -> Realtime -> TURN Server)
      - key: CLOUDFLARE_TURN_KEY_ID
        sync: false
      - key: CLOUDFLARE_TURN_API_TOKEN
        sync: false

  # FastAPI AI service (questions about PDFs, Gemini)
  - type: web
    name: smartlurn-ai
    runtime: python
    rootDir: ai-service
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-2.5-flash-lite
      - key: ALLOWED_ORIGINS # your Vercel URL, e.g. https://smartlurn.vercel.app
        sync: false
